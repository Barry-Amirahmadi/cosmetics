<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1375" viewBox="0 0 1100 1375" role="img">
  <defs>
    <radialGradient id="light" cx="78%" cy="18%" r="88%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="fall" x1="1" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#3E4C6B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3E4C6B" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="143.0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1100" height="1375" fill="#141A2B"/>
    <rect width="1100" height="1375" fill="url(#fall)" opacity="0.55"/>
    <g filter="url(#soft)">
      <ellipse cx="550" cy="756" rx="275" ry="352" fill="#3E4C6B" opacity="0.85"/>
      <ellipse cx="666" cy="594" rx="138" ry="120" fill="#FFFFFF" opacity="0.26"/>
      <ellipse cx="380" cy="932" rx="193" ry="141" fill="#000000" opacity="0.2"/>
    </g>
    <rect width="1100" height="1375" fill="url(#light)"/>
  </g>
</svg>

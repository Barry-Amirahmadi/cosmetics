<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <defs>
    <radialGradient id="light" cx="78%" cy="18%" r="88%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="fall" x1="1" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#C4B39A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#C4B39A" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="104.0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="61" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1200" height="800" fill="#EAE9E3"/>
    <rect width="1200" height="800" fill="url(#fall)" opacity="0.55"/>
    <g filter="url(#soft)">
      <ellipse cx="672" cy="400" rx="184" ry="236" fill="#C4B39A" opacity="0.85"/>
      <ellipse cx="749" cy="292" rx="92" ry="80" fill="#FFFFFF" opacity="0.26"/>
      <ellipse cx="558" cy="518" rx="129" ry="94" fill="#000000" opacity="0.2"/>
    </g>
    <rect width="1200" height="800" fill="url(#light)"/>
  </g>
</svg>
